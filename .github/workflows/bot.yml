name: GTA 6 news bot

on:
  schedule:
    # каждые 10 минут (репозиторий публичный — минуты Actions бесплатны).
    # Сдвиг на :03/:13/... — в :00 и :30 GitHub сильнее всего задерживает запуски.
    - cron: "3-59/10 * * * *"
  workflow_dispatch: {}
  push:                       # запуск сразу после изменения кода/настроек
    branches: [main]
    paths-ignore: [state.json, README.md]       # кнопка ручного запуска

concurrency:
  group: gta6-bot
  cancel-in-progress: false

permissions:
  contents: write             # чтобы сохранять state.json (что уже опубликовано)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python bot.py
      - name: Save state
        run: |
          git config user.name "gta6-bot"
          git config user.email "gta6-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git pull --rebase -X theirs && git push   # при rebase "theirs" = наш свежий state.json
